name: Keep Supabase alive

# The Supabase free plan pauses projects after 7 days of low activity.
# A daily call to public.ping() keeps the database awake.
on:
  schedule:
    - cron: '17 12 * * *' # every day at 09:17 in São Paulo (12:17 UTC)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.ping()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
